<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Roby</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  #start {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: white;
    font: bold 22px Arial, sans-serif;
    cursor: pointer;
    z-index: 10;
    text-align: center;
  }

  #start span {
    padding: 16px 26px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 14px;
    background: rgba(255,255,255,.08);
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="start">
  <span>Click to start ❤️<br><small style="font-size:14px;opacity:.7">Happy Birthday Roby</small></span>
</div>

<audio id="music" preload="auto" loop>
  <source src="love_you.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const start = document.getElementById("start");
const music = document.getElementById("music");

let W, H, scale, cx, cy;
let particles = [];
let frame = 0;
let started = false;

const colors = [
  [70,130,180],
  [30,144,255],
  [0,191,255],
  [100,149,237],
  [65,105,225]
];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  scale = Math.min(W, H) / 43;
  cx = W / 2;
  cy = H / 2;
}

function heartXY(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t)
          - 5 * Math.cos(2*t)
          - 2 * Math.cos(3*t)
          - Math.cos(4*t);
  return [x, -y];
}

function toScreen(x, y) {
  return [x * scale + cx, y * scale + cy];
}

function dist(a,b,c,d) {
  return Math.hypot(a-c,b-d);
}

function makeParticles() {
  particles = [];

  // A cleaner, mathematically sampled heart:
  // the outline follows the actual heart curve, while the inside
  // is filled row-by-row so the top lobes and center notch stay clean.
  const outline = [];
  const nOutline = 210;

  for (let i = 0; i < nOutline; i++) {
    const t = (i / nOutline) * Math.PI * 2;
    const [bx, by] = heartXY(t);
    const [x, y] = toScreen(bx, by);

    // Slightly larger spacing near the top keeps the two lobes distinct.
    const minGap = Math.max(7, scale * 0.38);
    if (!outline.some(p => Math.hypot(x-p[0], y-p[1]) < minGap)) {
      outline.push([x, y]);
      particles.push({
        x, y,
        delay: i * 1.15,
        alpha: 0,
        flicker: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: Math.max(9, scale * 0.34),
        word: ["happy birthday roby","Happy Birthday Roby","HAPPY BIRTHDAY ROBY"]
          [Math.floor(Math.random()*3)]
      });
    }
  }

  // Fill the heart using horizontal rows.
  // This avoids the ugly random holes around the upper lobes.
  const left = -16, right = 16, top = -13, bottom = 13;
  const step = Math.max(0.72, 20 / scale);
  let order = 0;

  function insideHeart(x, y) {
    const yy = -y;
    const v = Math.pow(x*x + yy*yy - 1, 3) - x*x * Math.pow(yy, 3);
    return v <= 0;
  }

  for (let y = top; y <= bottom; y += step) {
    // A tiny horizontal offset gives a natural particle texture.
    const offset = ((Math.floor((y-top)/step) % 2) * step * 0.5);

    for (let x = left + offset; x <= right; x += step) {
      if (!insideHeart(x / 16, y / 13)) continue;

      const [sx, sy] = toScreen(x, y);

      // Keep the outer contour clean by leaving a small inner margin.
      const edge = Math.min(
        Math.abs(16 - Math.abs(x)),
        Math.abs(13 - Math.abs(y))
      );
      if (edge < 0.45) continue;

      particles.push({
        x: sx, y: sy,
        delay: 205 + order * 0.42,
        alpha: 0,
        flicker: Math.random() * Math.PI * 2,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: Math.max(7, scale * 0.27),
        word: ["happy birthday roby","Happy Birthday Roby","HAPPY BIRTHDAY ROBY"]
          [Math.floor(Math.random()*3)]
      });

      order++;
    }
  }
}

function drawGlowText(p) {
  if (p.alpha <= 0) return;

  const [r,g,b] = p.color;
  const color = `rgb(${r},${g},${b})`;

  ctx.save();
  ctx.font = `bold ${p.size}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const flick = p.alpha >= 255
    ? .75 + .25 * Math.sin(frame*.04 + p.flicker)
    : 1;

  const alpha = Math.floor(p.alpha * flick);
  ctx.globalAlpha = alpha / 255;

  ctx.shadowColor = color;
  ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.fillText(p.word, p.x, p.y);

  ctx.shadowBlur = 5;
  ctx.fillText(p.word, p.x, p.y);

  ctx.restore();
}

function drawCenterText(alpha) {
  const pulse = 1 + .025 * Math.sin(frame*.05);
  const size = Math.max(24, Math.min(52, Math.min(W,H) * .043)) * pulse;

  ctx.save();
  ctx.globalAlpha = alpha / 255;
  ctx.font = `bold ${size}px Georgia, serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "rgb(255,250,245)";
  ctx.shadowColor = "rgba(255,255,255,.8)";
  ctx.shadowBlur = 28;
  ctx.fillText("Happy Birthday Roby", cx, cy);
  ctx.shadowBlur = 10;
  ctx.fillText("Happy Birthday Roby", cx, cy);
  ctx.restore();
}

function animate() {
  if (!started) return;

  frame++;
  ctx.clearRect(0,0,W,H);

  for (const p of particles) {
    if (frame > p.delay && p.alpha < 255) {
      p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random()*5));
    }
    drawGlowText(p);
  }

  const fillStart = 175 * 1.35 + 35;
  const centerStart = fillStart + 210;

  if (frame > centerStart) {
    const progress = Math.min(1, (frame-centerStart)/60);
    const alpha = Math.floor(255 * (1 - Math.exp(-progress*8)));
    drawCenterText(alpha);
  }

  requestAnimationFrame(animate);
}

function startExperience() {
  started = true;
  start.style.display = "none";

  music.play().catch(() => {});

  resize();
  makeParticles();
  frame = 0;
  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  resize();
  if (started) makeParticles();
});

resize();
start.addEventListener("click", startExperience);
</script>

</body>
</html>
